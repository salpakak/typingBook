<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link type="image/x-icon" href="favicon.ico" rel="shortcut icon" />
    <link type="Image/x-icon" href="favicon.ico" rel="icon" />
    <title>Typelit Book 1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="homeScreen" class="container">
      <h1>Тренажёр печати</h1>

      <label for="fileInput">Загрузите текст (.txt):</label>
      <input type="file" id="fileInput" accept=".txt" />

      <label for="savedTexts">Ранее загруженные:</label>
      <select id="savedTexts">
        <option disabled selected>Выберите...</option>
      </select>

      <button id="loadSaved">Открыть выбранный</button>
    </div>

    <div id="typingScreen" class="container hidden">
      <div id="pageInfo">
        Страница <span id="pageNumber">1</span> из
        <span id="totalPages">?</span>
        &nbsp; | &nbsp; Перейти:
        <input type="number" id="pageInput" min="1" />
        <button id="goToPage">OK</button>
      </div>

      <div id="contentRow">
        <div id="textColumn">
          <div id="textDisplay"></div>
          <input
            id="hiddenInput"
            type="text"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
          />
          <div id="stats">Символов: 0 | Ошибок: 0</div>
        </div>
        <div id="imageColumn">
          <img id="pageImage" src="" alt="Изображение страницы" />
        </div>
      </div>

      <div id="stats">Символов: 0 | Ошибок: 0</div>
      <button id="backBtn">← На главную</button>
      <button id="resetProgressBtn">🗑️ Сбросить прогресс</button>
    </div>
    <audio id="soundCtrl" src="sounds/ctrl.mp3" preload="auto"></audio>
    <audio id="soundEnter" src="sounds/enter.mp3" preload="auto"></audio>
    <audio
      id="soundBackspace"
      src="sounds/backspace.mp3"
      preload="auto"
    ></audio>
    <audio id="soundSpace" src="sounds/space.mp3" preload="auto"></audio>
    <label for="volumeSlider">Громкость:</label>
    <input
      type="range"
      id="volumeSlider"
      min="0"
      max="1"
      step="0.01"
      value="1"
    />
    <div id="translationHint" class="translationHint"></div>
    <div id="translationPopup" class="translation-popup"></div>

    <!-- <script src="script.js"></script> -->
    <script type="module" src="main.js"></script>
  </body>
</html>
